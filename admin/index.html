  .adm-side .brand { justify-self: start; text-align: left; margin: 0 0 20px 8px; }
  .adm-tab { text-align: left; background: none; border: 0; padding: .65rem .8rem; border-radius: var(--radius); color: var(--mute); display: flex; justify-content: space-between; align-items: center; font-family: var(--f-sans); font-stretch: 75%; text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; font-weight: 600; }

  .cal-views button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

  .mcal > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 104px; padding: .35rem; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mcal .dow { min-height: 0; color: var(--mute); text-align: center; }

  .mcal .today .dnum { color: var(--gold); font-weight: 700; }
  .mcal .off { background: repeating-linear-gradient(45deg, transparent 0 6px, var(--surface) 6px 7px); }
  .ev { display: block; width: 100%; text-align: left; border: 0; border-left: 2px solid var(--warn); background: var(--surface-2); padding: .2rem .35rem; font-size: .72rem; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 1px; }
