<!doctype html>
<html lang="es" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · Cristhian Pérez Tattoo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0c0b">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  body::after { display: none; }
  .adm { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
  .adm-side { border-right: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 20px) 14px 20px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .adm-side .brand { justify-self: start; text-align: left; margin: 0 0 20px 8px; }
  .adm-tab { text-align: left; background: none; border: 0; padding: .65rem .8rem; border-radius: var(--radius); color: var(--mute); display: flex; justify-content: space-between; align-items: center; font-family: var(--f-sans); font-stretch: 75%; text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; font-weight: 600; }
  .adm-tab:hover { color: var(--fg); background: var(--surface); }
  .adm-tab[aria-current="true"] { color: var(--fg); background: var(--surface-2); }
  .adm-tab .badge { background: var(--gold); color: var(--gold-ink); font: 700 .7rem/1 var(--f-mono); padding: .25rem .45rem; border-radius: 20px; letter-spacing: 0; }
  .adm-main { padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) 80px clamp(16px, 3vw, 40px); min-width: 0; }
  .adm-head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
  .adm-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.8rem); margin: 0; }
  @media (max-width: 860px) {
    .adm { grid-template-columns: 1fr; }
    .adm-side { position: sticky; top: 0; z-index: 20; height: auto; flex-direction: row; overflow-x: auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(10px, env(safe-area-inset-right, 0px)) 10px max(10px, env(safe-area-inset-left, 0px)); background: var(--bg); border-right: 0; border-bottom: 1px solid var(--line); }
    .adm-side .brand, .adm-side .side-foot { display: none; }
    .adm-tab { white-space: nowrap; flex: 0 0 auto; gap: .5rem; }
  }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: .5rem; padding: 8px; }
  .status-dot { display: inline-flex; gap: .4rem; align-items: center; font-size: .72rem; }
  .status-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .status-dot.on::before { background: var(--ok); }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .tbl th { text-align: left; font-family: var(--f-sans); font-stretch: 75%; text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; color: var(--mute); font-weight: 600; padding: .7rem .8rem; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
  .tbl td { padding: .75rem .8rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr[data-open] { cursor: pointer; }
  .tbl tr[data-open]:hover td { background: var(--surface); }
  .tbl .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .55rem; border-radius: 20px; font: 600 .68rem/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.pending, .pill.paid { color: var(--warn); }
  .pill.confirmed, .pill.shipped { color: var(--ok); }
  .pill.completed { color: var(--fg); }
  .pill.cancelled, .pill.rejected, .pill.needs_attention, .pill.refunded { color: var(--danger); }
  .pill.pending_payment, .pill.expired { color: var(--mute); }
  .thumb { width: 44px; height: 44px; object-fit: cover; border: 1px solid var(--line); background: var(--surface); }

  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 80; }
  .drawer { position: fixed; z-index: 81; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--bg); border-left: 1px solid var(--line); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) 22px; display: flex; flex-direction: column; gap: 1.2rem; }
  .drawer-top { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
  .kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: .45rem 1rem; font-size: .93rem; }
  .kv dt { color: var(--mute); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .box { border: 1px solid var(--line); background: var(--surface); padding: 1rem; display: flex; flex-direction: column; gap: .9rem; }
  .row-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
  .row-actions .btn { min-height: 42px; font-size: .74rem; padding: 0 1.1em; }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: var(--bg); border-color: var(--danger); }
  .design-big { max-width: 100%; max-height: 420px; object-fit: contain; border: 1px solid var(--line); background: var(--surface); }

  .cal-views { display: inline-flex; border: 1px solid var(--line); }
  .cal-views button { background: none; border: 0; padding: .5rem 1rem; color: var(--mute); font: 600 .72rem var(--f-sans); text-transform: uppercase; letter-spacing: .12em; font-stretch: 75%; }
  .cal-views button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .mcal > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 104px; padding: .35rem; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mcal .dow { min-height: 0; color: var(--mute); text-align: center; }
  .mcal .dnum { font-family: var(--f-mono); font-size: .75rem; color: var(--mute); }
  .mcal .today .dnum { color: var(--gold); font-weight: 700; }
  .mcal .off { background: repeating-linear-gradient(45deg, transparent 0 6px, var(--surface) 6px 7px); }
  .ev { display: block; width: 100%; text-align: left; border: 0; border-left: 2px solid var(--warn); background: var(--surface-2); padding: .2rem .35rem; font-size: .72rem; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 1px; }
  .ev.confirmed { border-color: var(--ok); }
  .ev.completed { border-color: var(--mute); color: var(--mute); }
  .ev.pending_payment { border-color: var(--line); color: var(--mute); }
  .ev.needs_attention { border-color: var(--danger); }
  @media (max-width: 700px) { .mcal > div { min-height: 64px; } .ev { font-size: 0; height: 6px; padding: 0; } }
  .wcal { display: grid; grid-template-columns: repeat(7, minmax(140px, 1fr)); gap: 8px; overflow-x: auto; }
  .wcal .col { border: 1px solid var(--line); min-height: 220px; padding: .5rem; display: flex; flex-direction: column; gap: 6px; }
  .wcal .ev, .dlist .ev { white-space: normal; font-size: .82rem; padding: .45rem .55rem; }
  .dlist { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }

  .grid-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 1rem; }
  .sched-row { display: grid; grid-template-columns: 110px 90px 1fr 1fr 1.6fr; gap: .6rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--line); }
  .sched-row .input { min-height: 42px; padding: .4rem .6rem; }
  @media (max-width: 700px) { .sched-row { grid-template-columns: 1fr 1fr; } .sched-row > :first-child { grid-column: 1 / -1; } }
  .sizes-row { display: grid; grid-template-columns: 1.2fr 1.4fr .8fr .8fr 40px; gap: .5rem; margin-bottom: .5rem; align-items: center; }
  .sizes-row .input { min-height: 42px; padding: .4rem .6rem; }
  @media (max-width: 700px) { .sizes-row { grid-template-columns: 1fr 1fr; } }
  .img-list { display: flex; gap: .5rem; flex-wrap: wrap; }
  .img-list figure { margin: 0; position: relative; }
  .img-list img { width: 84px; height: 84px; object-fit: cover; border: 1px solid var(--line); }
  .img-list button { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--bg); color: var(--fg); font-size: .8rem; }
  .save-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: .9rem 0 calc(env(safe-area-inset-bottom, 0px) + .9rem); display: flex; gap: 1rem; align-items: center; margin-top: 1.4rem; z-index: 5; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .login form { width: min(400px, 100%); display: flex; flex-direction: column; gap: 1rem; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 10px; margin-bottom: 1.6rem; }
  .stat { border: 1px solid var(--line); padding: .9rem 1rem; background: var(--surface); }
  .stat b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 2rem; line-height: 1.1; }
</style>
</head>
<body>
<div id="app"><div class="login"><p class="muted">Cargando…</p></div></div>
<script src="../assets/js/seed.js" defer></script>
<script src="../assets/js/availability.js" defer></script>
<script src="../assets/js/common.js" defer></script>
<script src="../assets/js/admin.js" defer></script>
</body>
</html>
